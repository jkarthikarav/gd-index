name: Update color library

on:
  push:
    branches: [main]
    paths:
      - 'assets/library/**'
      - 'scripts/extract-colors.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Extract colors
        run: npm run generate

      - name: Commit updated library.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library.json
          if git diff --cached --quiet; then
            echo "No changes to library.json"
          else
            git commit -m "Update color library [skip ci]"
            git push
          fi
